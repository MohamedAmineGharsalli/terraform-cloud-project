# ---------------------------------------------------------------------------
# Pipeline CI/CD Terraform - projet cloud5
#
# Declencheurs :
#   - pull_request      : fmt + validate + test + plan sur les 3 environnements
#                         (le plan est publie en commentaire de PR)
#   - push sur main     : fmt + validate + test + apply sur dev uniquement
#   - workflow_dispatch : plan + apply sur l'environnement choisi (ou tous)
#
# Chaque job d'apply declare un "environment" GitHub (dev / test / prod) : les
# protections et secrets de l'environnement s'appliquent, et l'historique de
# deploiement est trace par environnement.
#
# Les identifiants AWS du Learner Lab sont TEMPORAIRES (cle + secret + jeton de
# session) et proviennent des secrets GitHub :
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN
# Le mot de passe RDS provient du secret DB_PASSWORD (jamais dans le depot).
#
# Aucune ressource IAM n'est creee : le pipeline utilise le role pre-existant
# LabRole / LabInstanceProfile (data sources des modules security et compute).
# ---------------------------------------------------------------------------
name: terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement a planifier/deployer"
        type: choice
        options:
          - dev
          - test
          - prod
          - all
        default: dev

# Permissions minimales par defaut : lecture seule du depot.
permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: "us-east-1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  # -------------------------------------------------------------------------
  # 0. Choisit la liste des environnements a traiter et, pour chaque
  #    environnement, si le job d'apply correspondant doit s'executer.
  #    - pull_request      -> plan sur ["dev","test","prod"], aucun apply
  #    - push sur main     -> apply sur dev uniquement
  #    - workflow_dispatch -> ["<choix>"] (ou les trois si "all")
  # -------------------------------------------------------------------------
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.select.outputs.environments }}
      run_dev: ${{ steps.select.outputs.run_dev }}
      run_test: ${{ steps.select.outputs.run_test }}
      run_prod: ${{ steps.select.outputs.run_prod }}
    env:
      DISPATCH_ENV: ${{ inputs.environment }}
    steps:
      - name: Select environments
        id: select
        run: |
          run_dev=false
          run_test=false
          run_prod=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${DISPATCH_ENV:-dev}" in
              all)
                run_dev=true; run_test=true; run_prod=true
                environments='["dev","test","prod"]'
                ;;
              dev)
                run_dev=true
                environments='["dev"]'
                ;;
              test)
                run_test=true
                environments='["test"]'
                ;;
              prod)
                run_prod=true
                environments='["prod"]'
                ;;
              *)
                echo "Environnement inconnu : ${DISPATCH_ENV}" >&2
                exit 1
                ;;
            esac
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            run_dev=true
            environments='["dev"]'
          else
            # pull_request : plan sur les trois environnements, aucun apply.
            environments='["dev","test","prod"]'
          fi

          {
            echo "environments=${environments}"
            echo "run_dev=${run_dev}"
            echo "run_test=${run_test}"
            echo "run_prod=${run_prod}"
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # 1. Formatage : tout le depot doit etre deja formate.
  # -------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

  # -------------------------------------------------------------------------
  # 2. Validation statique de chaque module et de chaque environnement
  #    (sans backend ni identifiants AWS).
  # -------------------------------------------------------------------------
  validate:
    name: validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: [fmt]
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/network
          - modules/security
          - modules/load-balancer
          - modules/compute
          - modules/database
          - modules/storage
          - environments/dev
          - environments/test
          - environments/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (sans backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.dir }}

      - name: terraform validate
        run: terraform validate -no-color
        working-directory: ${{ matrix.dir }}

  # -------------------------------------------------------------------------
  # 3. Tests des scripts : fins de ligne LF, syntaxe bash, arguments des
  #    scripts s3_bucket_admin.{ps1,sh} (aucun identifiant AWS requis).
  # -------------------------------------------------------------------------
  test:
    name: tests (scripts)
    runs-on: ubuntu-latest
    needs: [fmt]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run script tests
        shell: pwsh
        run: ./tests/run-tests.ps1 -Suite scripts -NoLog

  # -------------------------------------------------------------------------
  # 4. Plan : sur pull_request et workflow_dispatch.
  #    Le plan binaire n'est jamais publie : seul un plan.txt lisible est
  #    affiche (resume du job) et, sur PR, poste en commentaire.
  # -------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [prepare, validate]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: terraform-plan-${{ matrix.environment }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.prepare.outputs.environments) }}
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: environments/${{ matrix.environment }}
    steps:
      # Fail fast with a readable message if a required secret is missing.
      # Only the NAMES of the missing secrets are printed, never their values.
      - name: Check required secrets
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=""
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then missing="${missing} AWS_ACCESS_KEY_ID"; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then missing="${missing} AWS_SECRET_ACCESS_KEY"; fi
          if [ -z "${AWS_SESSION_TOKEN}" ]; then missing="${missing} AWS_SESSION_TOKEN"; fi
          if [ -z "${DB_PASSWORD}" ]; then missing="${missing} DB_PASSWORD"; fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing or empty GitHub secrets:${missing}. Set them in Settings > Secrets and variables > Actions (the AWS credentials expire at every lab session)."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Clear early failure if the credentials are missing or expired.
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      # Rendu lisible du plan (sans couleurs) : c'est ce fichier, et non le
      # binaire tfplan, qui est publie.
      - name: terraform show (plan.txt)
        run: terraform show -no-color tfplan > plan.txt

      - name: Plan summary
        run: head -n 200 plan.txt >> "$GITHUB_STEP_SUMMARY"

      # Commentaire de PR : plan tronque (limite GitHub ~65536 caracteres) et
      # sans couleurs. Un marqueur par environnement permet de mettre a jour le
      # commentaire existant plutot que d'en creer un nouveau a chaque push.
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_FILE: environments/${{ matrix.environment }}/plan.txt
          PLAN_MARKER: "<!-- terraform-plan:${{ matrix.environment }} -->"
        with:
          script: |
            const fs = require('fs');
            const marker = process.env.PLAN_MARKER;
            const max = 60000;

            let plan = '';
            try {
              plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            } catch (error) {
              plan = `(plan.txt introuvable : ${error.message})`;
            }

            let truncated = false;
            if (plan.length > max) {
              plan = plan.slice(0, max);
              truncated = true;
            }

            const lines = [
              marker,
              `### Terraform plan — \`${{ matrix.environment }}\``,
              '',
              '```terraform',
              plan,
              '```',
            ];
            if (truncated) {
              lines.push('', '> ⚠️ Plan tronqué (limite d’affichage de GitHub).');
            }
            const body = lines.join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number }
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  # -------------------------------------------------------------------------
  # 5. Apply : uniquement sur main (push ou workflow_dispatch depuis main).
  #    Le plan et l'apply s'executent dans le MEME job : l'apply consomme
  #    exactement le plan produit (aucun tfplan transmis entre jobs).
  # -------------------------------------------------------------------------
  apply-dev:
    name: apply (dev)
    runs-on: ubuntu-latest
    needs: [prepare, validate]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.run_dev == 'true'
    environment: dev
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      # Fail fast with a readable message if a required secret is missing.
      # Only the NAMES of the missing secrets are printed, never their values.
      - name: Check required secrets
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=""
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then missing="${missing} AWS_ACCESS_KEY_ID"; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then missing="${missing} AWS_SECRET_ACCESS_KEY"; fi
          if [ -z "${AWS_SESSION_TOKEN}" ]; then missing="${missing} AWS_SESSION_TOKEN"; fi
          if [ -z "${DB_PASSWORD}" ]; then missing="${missing} DB_PASSWORD"; fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing or empty GitHub secrets:${missing}. Set them in Settings > Secrets and variables > Actions (the AWS credentials expire at every lab session)."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Clear early failure if the credentials are missing or expired.
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: terraform output
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"

  apply-test:
    name: apply (test)
    runs-on: ubuntu-latest
    needs: [prepare, validate]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.run_test == 'true'
    environment: test
    concurrency:
      group: terraform-apply-test
      cancel-in-progress: false
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: environments/test
    steps:
      # Fail fast with a readable message if a required secret is missing.
      # Only the NAMES of the missing secrets are printed, never their values.
      - name: Check required secrets
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=""
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then missing="${missing} AWS_ACCESS_KEY_ID"; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then missing="${missing} AWS_SECRET_ACCESS_KEY"; fi
          if [ -z "${AWS_SESSION_TOKEN}" ]; then missing="${missing} AWS_SESSION_TOKEN"; fi
          if [ -z "${DB_PASSWORD}" ]; then missing="${missing} DB_PASSWORD"; fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing or empty GitHub secrets:${missing}. Set them in Settings > Secrets and variables > Actions (the AWS credentials expire at every lab session)."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Clear early failure if the credentials are missing or expired.
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: terraform output
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: apply (prod)
    runs-on: ubuntu-latest
    needs: [prepare, validate]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.run_prod == 'true'
    environment: prod
    concurrency:
      group: terraform-apply-prod
      cancel-in-progress: false
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    defaults:
      run:
        working-directory: environments/prod
    steps:
      # Fail fast with a readable message if a required secret is missing.
      # Only the NAMES of the missing secrets are printed, never their values.
      - name: Check required secrets
        working-directory: ${{ github.workspace }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          missing=""
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then missing="${missing} AWS_ACCESS_KEY_ID"; fi
          if [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then missing="${missing} AWS_SECRET_ACCESS_KEY"; fi
          if [ -z "${AWS_SESSION_TOKEN}" ]; then missing="${missing} AWS_SESSION_TOKEN"; fi
          if [ -z "${DB_PASSWORD}" ]; then missing="${missing} DB_PASSWORD"; fi
          if [ -n "${missing}" ]; then
            echo "::error::Missing or empty GitHub secrets:${missing}. Set them in Settings > Secrets and variables > Actions (the AWS credentials expire at every lab session)."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Clear early failure if the credentials are missing or expired.
      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: terraform output
        run: terraform output -no-color >> "$GITHUB_STEP_SUMMARY"
